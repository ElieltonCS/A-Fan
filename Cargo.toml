[package]
name = "a-fan"
version = "0.1.0"
edition = "2024"
description = "Controle e monitoramento protegido de ventoinha Acer"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation", "Win32_Security", "Win32_System_Com",
    "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Wmi",
    "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Power",
    "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls",
    "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_UI_HiDpi"
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
